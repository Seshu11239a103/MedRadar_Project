<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070d14"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <!-- Background Card -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bg)" stroke="#0ea5e9" stroke-width="8"/>
  
  <!-- Radar concentric circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#0ea5e9" stroke-width="2.5" stroke-opacity="0.5"/>
  
  <!-- Radar Crosshairs -->
  <line x1="76" y1="256" x2="436" y2="256" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.35"/>
  <line x1="256" y1="76" x2="256" y2="436" stroke="#0ea5e9" stroke-width="3" stroke-opacity="0.35"/>
  
  <!-- Central Angled Pill -->
  <g transform="rotate(-30 256 256)">
    <!-- Pill Left Half (Cyan) -->
    <path d="M 156 216 A 40 40 0 0 1 256 216 L 256 296 A 40 40 0 0 1 156 296 Z" fill="url(#cyanGrad)" stroke="#ffffff" stroke-width="6"/>
    <!-- Pill Right Half (Emerald) -->
    <path d="M 256 216 A 40 40 0 0 1 356 216 L 356 296 A 40 40 0 0 1 256 296 Z" fill="url(#emeraldGrad)" stroke="#ffffff" stroke-width="6"/>
    <!-- Medical Cross on Left -->
    <rect x="198" y="244" width="24" height="24" fill="#ffffff" rx="4"/>
    <rect x="204" y="238" width="12" height="36" fill="#ffffff" rx="3"/>
  </g>
  
  <!-- Blip dot alert -->
  <circle cx="360" cy="160" r="14" fill="#f43f5e" stroke="#ffffff" stroke-width="4"/>
  <circle cx="360" cy="160" r="28" fill="none" stroke="#f43f5e" stroke-width="3" opacity="0.6"/>
</svg>
